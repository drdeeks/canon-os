<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Canon OS — Image Studio</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:980px;margin:2rem auto;padding:0 1rem;background:#10131a;color:#edf1f7}main{display:grid;gap:1rem}canvas{max-width:100%;border:1px solid #5e6b82;cursor:crosshair;background:#202633}label{display:grid;gap:.4rem}textarea,button,select,input{font:inherit;padding:.6rem}button{cursor:pointer;background:#8066ff;color:white;border:0;border-radius:.3rem}button[aria-pressed="true"]{background:#f4b942;color:#17120a}#result img{max-width:100%;margin-top:1rem}.row{display:flex;gap:1rem;flex-wrap:wrap}.row>*{flex:1}.mask-tools{align-items:end}.mask-tools fieldset{border:0;margin:0;padding:0;display:flex;gap:.5rem;flex-wrap:wrap}.mask-tools legend{margin-bottom:.4rem}
  </style>
</head>
<body><main>
  <h1>Image &amp; Photo Studio</h1>
  <p>Upload an image, select an editable region with a brush, lasso, or full-frame mask, then preview. Final rendering is enabled only after approval.</p>
  <div class="row"><label>Source image <input id="source" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Mode <select id="mode"><option value="inpaint">Inpaint</option><option value="outpaint">Outpaint</option><option value="restyle">Restyle</option></select></label></div>
  <div class="row"><label>Prompt <textarea id="prompt" maxlength="1000" placeholder="Replace the selected background with a warm studio setting"></textarea></label><label>Brand palette <input id="palette" placeholder="#6C5CE7, #FDCB6E"></label></div>
  <div class="row mask-tools"><fieldset aria-label="Mask selection tool"><legend>Mask tool</legend><button class="tool" id="brush" type="button" aria-pressed="true">Brush</button><button class="tool" id="lasso" type="button" aria-pressed="false">Lasso</button><button id="full-frame" type="button">Full frame</button></fieldset><button id="close-lasso" type="button" hidden>Close lasso</button></div>
  <canvas id="canvas" width="800" height="500" aria-label="Select an editable image region with brush, lasso, or full-frame masking"></canvas>
  <div class="row"><button id="clear" type="button">Clear mask</button><button id="preview" type="button">Render flash preview</button><button id="final" type="button">Approve and render final</button></div>
  <output id="status" aria-live="polite"></output><div id="result"></div>
</main>
<script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),source=document.querySelector('#source'),mask=document.createElement('canvas'),maskCtx=mask.getContext('2d'),overlay=document.createElement('canvas'),overlayCtx=overlay.getContext('2d'),status=document.querySelector('#status');let image=null,drawing=false,dirty=false,tool='brush',lassoPoints=[],pointer=null;
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function redraw(previewPoint){if(!image)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0);overlayCtx.clearRect(0,0,overlay.width,overlay.height);overlayCtx.drawImage(mask,0,0);overlayCtx.globalCompositeOperation='source-in';overlayCtx.fillStyle='#ef4444';overlayCtx.fillRect(0,0,overlay.width,overlay.height);overlayCtx.globalCompositeOperation='source-over';ctx.globalAlpha=.65;ctx.drawImage(overlay,0,0);ctx.globalAlpha=1;if(tool==='lasso'&&lassoPoints.length){ctx.strokeStyle='#f4b942';ctx.lineWidth=Math.max(2,canvas.width/400);ctx.beginPath();ctx.moveTo(lassoPoints[0].x,lassoPoints[0].y);[...lassoPoints.slice(1),previewPoint].filter(Boolean).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke()}}
function resetMask(){mask.width=canvas.width;mask.height=canvas.height;overlay.width=canvas.width;overlay.height=canvas.height;lassoPoints=[];dirty=false;redraw()}
function selectTool(next){tool=next;lassoPoints=[];document.querySelectorAll('.tool').forEach(button=>button.setAttribute('aria-pressed',String(button.id===next)));document.querySelector('#close-lasso').hidden=next!=='lasso';canvas.style.cursor=next==='lasso'?'cell':'crosshair';redraw();status.textContent=next==='lasso'?'Click to add lasso points, then close the lasso.':`${next[0].toUpperCase()+next.slice(1)} mask selected.`}
source.onchange=()=>{const f=source.files[0];if(!f)return;const u=URL.createObjectURL(f);image=new Image();image.onload=()=>{canvas.width=image.width;canvas.height=image.height;resetMask();URL.revokeObjectURL(u)};image.src=u};
function paint(e){if(!drawing||tool!=='brush')return;const p=point(e);maskCtx.fillStyle='#fff';maskCtx.beginPath();maskCtx.arc(p.x,p.y,Math.max(12,canvas.width/45),0,Math.PI*2);maskCtx.fill();dirty=true;redraw()}
function closeLasso(){if(lassoPoints.length<3){status.textContent='Add at least three points to close a lasso.';return}maskCtx.fillStyle='#fff';maskCtx.beginPath();maskCtx.moveTo(lassoPoints[0].x,lassoPoints[0].y);lassoPoints.slice(1).forEach(p=>maskCtx.lineTo(p.x,p.y));maskCtx.closePath();maskCtx.fill();lassoPoints=[];dirty=true;redraw();status.textContent='Lasso mask applied.'}
canvas.onpointerdown=e=>{if(!image)return;if(tool==='lasso'){lassoPoints.push(point(e));redraw();return}drawing=true;pointer=e.pointerId;canvas.setPointerCapture?.(pointer);paint(e)};canvas.onpointermove=e=>{if(tool==='lasso'&&lassoPoints.length)redraw(point(e));else paint(e)};canvas.onpointerup=e=>{drawing=false;if(pointer===e.pointerId)canvas.releasePointerCapture?.(pointer);pointer=null};canvas.ondblclick=e=>{if(tool==='lasso'){e.preventDefault();closeLasso()}};
document.querySelector('#brush').onclick=()=>selectTool('brush');document.querySelector('#lasso').onclick=()=>selectTool('lasso');document.querySelector('#close-lasso').onclick=closeLasso;document.querySelector('#full-frame').onclick=()=>{if(!image)return;maskCtx.fillStyle='#fff';maskCtx.fillRect(0,0,mask.width,mask.height);dirty=true;lassoPoints=[];redraw();status.textContent='Full-frame mask applied.'};document.querySelector('#clear').onclick=()=>{if(image)resetMask()};
async function render(final){const file=source.files[0],prompt=document.querySelector('#prompt').value.trim();if(!file||!prompt||!dirty){status.textContent='Choose an image, enter a prompt, and select a mask first.';return}const fd=new FormData();fd.append('source_image',file);fd.append('mask',await new Promise(r=>mask.toBlob(r,'image/png')),'mask.png');fd.append('prompt',prompt);fd.append('brand_palette',document.querySelector('#palette').value.trim());fd.append('mode',document.querySelector('#mode').value);fd.append('tier',final?'final':'flash');fd.append('approved',final);status.textContent='Rendering…';const res=await fetch('/api/v1/studio/inpaint',{method:'POST',body:fd}),job=await res.json();if(!res.ok){status.textContent=job.error;return}status.textContent=`${job.status}; SHA-256 ${job.checksum}`;result.innerHTML=`<img src="${job.image_url}" alt="Generated studio asset">`}
preview.onclick=()=>render(false);final.onclick=()=>render(true);
</script></body></html>
