<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflows - AI Creative Studio</title>
    <style>
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
            --green: #3fb950; --red: #f85149; --yellow: #d29922;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: var(--bg); color: var(--text); }
        .header { background: var(--surface); border-bottom: 1px solid var(--border);
                  padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.4em; }
        .header h1 span { color: var(--accent); }
        .nav { display: flex; gap: 8px; }
        .nav a { color: var(--dim); text-decoration: none; padding: 8px 16px;
                 border-radius: var(--radius); transition: all 0.2s; }
        .nav a:hover, .nav a.active { color: var(--text); background: var(--bg); }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .workflow-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

        .workflow-card { background: var(--surface); border: 1px solid var(--border);
                         border-radius: var(--radius); padding: 24px; cursor: pointer;
                         transition: all 0.2s; }
        .workflow-card:hover { border-color: var(--accent); transform: translateY(-2px); }

        .workflow-card .name { font-size: 1.15em; font-weight: 600; margin-bottom: 4px; }
        .workflow-card .desc { color: var(--dim); font-size: 0.9em; margin-bottom: 12px; }

        .workflow-card .meta { display: flex; gap: 16px; font-size: 0.85em; color: var(--dim); }
        .workflow-card .meta span { display: flex; align-items: center; gap: 4px; }

        .workflow-card .category { display: inline-block; padding: 2px 10px; border-radius: 10px;
                                    font-size: 0.75em; font-weight: 600; margin-bottom: 8px; }
        .cat-video { background: rgba(88,166,255,0.15); color: var(--accent); }
        .cat-image { background: rgba(63,185,80,0.15); color: var(--green); }
        .cat-audio { background: rgba(210,153,34,0.15); color: var(--yellow); }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7);
                         display: none; justify-content: center; align-items: center;
                         z-index: 100; }
        .modal-overlay.show { display: flex; }

        .modal { background: var(--surface); border: 1px solid var(--border);
                 border-radius: var(--radius); padding: 32px; max-width: 640px;
                 width: 90%; max-height: 85vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 8px; }
        .modal .desc { color: var(--dim); margin-bottom: 24px; }

        .modal .step { padding: 16px 0; border-bottom: 1px solid var(--border); }
        .modal .step:last-child { border-bottom: none; }
        .modal .step-name { font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .modal .step-num { background: var(--accent); color: #fff; width: 24px; height: 24px;
                           border-radius: 50%; display: flex; align-items: center; justify-content: center;
                           font-size: 0.8em; flex-shrink: 0; }

        .modal .field { margin: 8px 0; }
        .modal .field label { display: block; font-size: 0.85em; color: var(--dim); margin-bottom: 4px; }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
            color: var(--text); font-size: 0.9em; }
        .modal textarea { resize: vertical; min-height: 60px; }
        .modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }

        .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn { padding: 10px 24px; border: 1px solid var(--border); border-radius: 8px;
               background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.95em; }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }

        .progress-step { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
        .progress-step .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); }
        .progress-step .dot.done { background: var(--green); border-color: var(--green); }
        .progress-step .dot.active { border-color: var(--accent); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(88,166,255,0.4); } 50% { box-shadow: 0 0 0 6px rgba(88,166,255,0); } }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>AI</span> Creative Studio</h1>
        <div class="nav">
            <a href="/">Dashboard</a>
            <a href="/models">Models</a>
            <a href="/workflows" class="active">Workflows</a>
            <a href="/projects">Projects</a>
            <a href="/settings">Settings</a>
        </div>
    </div>

    <div class="container">
        <h1 style="margin-bottom:24px">Workflows</h1>

        <div class="workflow-grid" id="workflowGrid"></div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modalTitle"></h2>
            <p class="desc" id="modalDesc"></p>
            <div id="modalSteps"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="runWorkflow()">Run Workflow</button>
                <button class="btn" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let workflows = [];
        let currentWorkflow = null;

        const CATEGORY_ICONS = { video: '', image: '', audio: '' };
        const CATEGORY_CLASSES = { video: 'cat-video', image: 'cat-image', audio: 'cat-audio' };

        // Load workflows
        fetch('/static/workflows.json')
            .then(r => r.json())
            .then(data => {
                workflows = data.workflows;
                renderGrid();
            })
            .catch(() => {
                // Fallback: render from inline data
                document.getElementById('workflowGrid').innerHTML =
                    '<p style="color:var(--dim)">Workflow templates will appear here once configured.</p>';
            });

        function renderGrid() {
            const grid = document.getElementById('workflowGrid');
            grid.innerHTML = workflows.map(w => `
                <div class="workflow-card" onclick="openWorkflow('${w.id}')">
                    <span class="category ${CATEGORY_CLASSES[w.category] || ''}">
                        ${CATEGORY_ICONS[w.category] || ''} ${w.category}
                    </span>
                    <div class="name">${w.name}</div>
                    <div class="desc">${w.description}</div>
                    <div class="meta">
                        <span>${w.difficulty}</span>
                        <span>${w.time_estimate}</span>
                        <span>${w.steps.length} steps</span>
                    </div>
                </div>
            `).join('');
        }

        function openWorkflow(id) {
            currentWorkflow = workflows.find(w => w.id === id);
            if (!currentWorkflow) return;

            document.getElementById('modalTitle').textContent = currentWorkflow.name;
            document.getElementById('modalDesc').textContent = currentWorkflow.description;

            const stepsHtml = currentWorkflow.steps.map((step, i) => {
                let inputsHtml = '';
                if (step.inputs) {
                    inputsHtml = step.inputs.map(inp => {
                        const id = `inp_${step.id}_${inp.name}`;
                        if (inp.type === 'select') {
                            return `<div class="field"><label>${inp.name.replace(/_/g, ' ')}</label>
                                <select id="${id}">${inp.options.map(o =>
                                    `<option value="${o}" ${o === inp.default ? 'selected' : ''}>${o}</option>`
                                ).join('')}</select></div>`;
                        } else if (inp.type === 'textarea') {
                            return `<div class="field"><label>${inp.name.replace(/_/g, ' ')}</label>
                                <textarea id="${id}" placeholder="${inp.placeholder || ''}">${inp.default || ''}</textarea></div>`;
                        } else if (inp.type === 'number' || inp.type === 'range') {
                            return `<div class="field"><label>${inp.name.replace(/_/g, ' ')}: <span id="${id}_val">${inp.default}</span></label>
                                <input type="range" id="${id}" min="${inp.min}" max="${inp.max}" step="${inp.step||1}" value="${inp.default}"
                                oninput="document.getElementById('${id}_val').textContent=this.value"></div>`;
                        } else {
                            return `<div class="field"><label>${inp.name.replace(/_/g, ' ')}</label>
                                <input type="text" id="${id}" placeholder="${inp.placeholder||''}" value="${inp.default||''}"></div>`;
                        }
                    }).join('');
                }

                return `<div class="step">
                    <div class="step-name"><span class="step-num">${i+1}</span> ${step.name}</div>
                    <div style="color:var(--dim);font-size:0.85em;margin-bottom:8px">Tool: ${step.tool}</div>
                    ${inputsHtml}
                </div>`;
            }).join('');

            document.getElementById('modalSteps').innerHTML = stepsHtml;
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            currentWorkflow = null;
        }

        async function runWorkflow() {
            if (!currentWorkflow) return;

            // Collect inputs
            const inputs = {};
            currentWorkflow.steps.forEach(step => {
                if (step.inputs) {
                    step.inputs.forEach(inp => {
                        const el = document.getElementById(`inp_${step.id}_${inp.name}`);
                        if (el) inputs[`${step.id}.${inp.name}`] = el.value;
                    });
                }
            });

            try {
                const r = await fetch('/api/workflow/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({workflow_id: currentWorkflow.id, inputs})
                });
                const data = await r.json();
                alert(data.message || 'Workflow started!');
                closeModal();
            } catch(e) {
                alert('Failed: ' + e.message);
            }
        }

        // Close modal on overlay click
        document.getElementById('modal').addEventListener('click', e => {
            if (e.target.id === 'modal') closeModal();
        });
    </script>
</body>
</html>
