crew_id: canon-os-hackathon
token_budget:
  total: 2500
  alert_at: 0.70
  hard_stop_at: 0.90
  reserve: 250
  caps: { builder: 1700, reviewer: 500, director: 300 }
model_policy:
  default: fast_iteration
  maximum_reasoning: director_only
  thinking: disabled_except_director_release
  max_output_tokens: { builder: 700, reviewer: 300, director: 250 }
  active_agent_limit: 1
  regenerate_only_failure: true
  retrieve_not_remember: true
loop_runner:
  command: python3 docs/hackathon/crew/canon-os-hackathon/scripts/run_loop.py
  dispatch: one_active_chain_item
  completion: requires_gate_evidence_and_review
