# ─────────────────────────────────────────────────────────────────────────────
# REVIEW MODEL (established mechanism — Creative Orchestration Doctrine)
#
# There are TWO distinct reviews, at two scopes. Both are OWNED BY A REVIEWER,
# never by the creating agent (Doctrine Principle V — Critique Is Equal to
# Creation; "every creative layer has a corresponding reviewer").
#
#   1) IN-PHASE PEER VERIFICATION  (runs EVERY phase, right after the create
#      agent finishes)
#        - A dedicated reviewer agent in the SAME phase verifies the create
#          agent's output.
#        - This is REAL functional checking: is the code actually implemented,
#          actually runs, actually correct — not merely "present."
#        - The loop enforcer GATES the phase on this pass. A verified phase is
#          LOCKED and never re-opened; verification accumulates forward.
#
#   2) FINAL HOLISTIC REVIEW  (runs ONCE, at the end)
#        - A single final reviewer (Director) judges the WHOLE repo:
#          wholesome code intact, all deliverables proper, structure
#          streamlined and organized, coherent end-to-end.
#        - Director's one question: "Would this be released?" If not: identify
#          the weakest component, revise only that (Principle VII — Regenerate
#          Only Failure), repeat.
# ─────────────────────────────────────────────────────────────────────────────

review_model:
  in_phase_peer_verification:
    scope: "single phase"
    runs: "every phase, immediately after the create agent completes"
    verifier: "dedicated reviewer agent (NOT the create agent), same phase"
    checks: "functional — code implemented, runs, correct; deliverables non-empty"
    gate: "loop enforcer blocks phase completion until reviewer passes"
    lock: "verified phase is locked; chain never returns to it"
  final_holistic_review:
    scope: "whole repository"
    runs: "once, after all phases verified complete"
    reviewer: "<FINAL_REVIEWER_ROLE>  # e.g. Director"
    checks: "wholesome code intact, all deliverables proper, repo structure streamlined + organized, coherence end-to-end"
    question: "Would this be released?"
    on_fail: "identify weakest component, revise only that, repeat (regenerate-only-failure)"

# EXAMPLE mapping only — each phase has a CREATE role AND a dedicated VERIFY role.
# role names, phase IDs, and model tiers are placeholders.
agent_chain_map:
  PHASE-0-foundation:
    create: { role: "foundation",           tier: "<REASONING_MODEL>" }
    verify: { role: "foundation-reviewer",  tier: "<BALANCED_MODEL>", checks: "foundation code implemented + functional, repo scaffold correct" }
  PHASE-1-core-engine:
    create: { role: "ai-engine",            tier: "<REASONING_MODEL>" }
    verify: { role: "ai-engine-reviewer",   tier: "<BALANCED_MODEL>", checks: "engine integrates + runs, outputs valid" }
  PHASE-2-generation:
    create: { role: "content-orchestrator", tier: "<BALANCED_MODEL>" }
    verify: { role: "generation-reviewer",  tier: "<FAST_MODEL>",     checks: "generation pipeline produces valid artifacts" }
  PHASE-3-distribution:
    create: { role: "distribution",         tier: "<BALANCED_MODEL>" }
    verify: { role: "distribution-reviewer",tier: "<FAST_MODEL>",     checks: "format adaptation + delivery correct" }
  PHASE-4-control-surface:
    create: { role: "frontend",             tier: "<REASONING_MODEL>" }
    verify: { role: "frontend-reviewer",    tier: "<BALANCED_MODEL>", checks: "UI wired, real-time updates functional" }
  PHASE-5-optimization:
    create: { role: "data-scientist",       tier: "<REASONING_MODEL>" }
    verify: { role: "optimization-reviewer",tier: "<BALANCED_MODEL>", checks: "analytics + adaptive loop functional" }
  PHASE-6-deployment:
    create: { role: "devops",               tier: "<BALANCED_MODEL>" }
    verify: { role: "deployment-reviewer",  tier: "<FAST_MODEL>",     checks: "deploy config valid, monitoring + security in place" }

# Runs after all phases above are verified + locked.
final_review:
  reviewer: "<FINAL_REVIEWER_ROLE>"   # e.g. Director
  tier: "<REASONING_MODEL>"
  scope: "whole repository — wholesome code intact, structure streamlined + organized"

# EXAMPLE context strategy — reconcile with established strategy
context_strategy:
