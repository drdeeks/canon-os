# Qwen Model Map — Token-Optimized Creative Pipeline
# Strategy: cheapest viable model per task tier, flash for iteration, quality for final
# Target: maximize output quality under limited token budget
# Track: AI Showrunner — Short Drama (highest token allowance)

# =============================================================================
# PRINCIPLE: Token reduction through model tiering
# =============================================================================
# Every agent uses TWO models:
#   - ITERATION model (flash/turbo): fast, cheap, used during revision loops
#   - FINAL model (plus/max): expensive, used only when artifact passes evaluation
#
# Token savings: ~60-70% reduction by using flash for 80% of invocations

# =============================================================================
# TEXT MODELS — Reasoning & Writing
# =============================================================================
text_models:
  # Tier 1: Maximum reasoning (rare invocations — creative vision, final review)
  maximum_reasoning:
    model: "qwen3-max"
    use_case: "Executive Director vision synthesis, Director holistic review, Prompt Composer optimization"
    token_cost: "highest"
    invocation_limit: "2-3 per project"
    thinking: "enable for complex synthesis only"
    
  # Tier 2: Strong reasoning (moderate invocations — planning, writing)
  strong_reasoning:
    model: "qwen3.5-plus"
    use_case: "Narrative Architect structure, Screenwriter dialogue"
    token_cost: "medium"
    invocation_limit: "5-10 per project"
    thinking: "disable unless structural complexity demands it"
    context_window: "1M tokens — use retrieval, never full context"
    
  # Tier 3: Fast iteration (high invocations — revisions, evaluations)
  fast_iteration:
    model: "qwen3.5-flash"
    use_case: "Revision loops, quick evaluations, format validation, assembly logic"
    token_cost: "lowest"
    invocation_limit: "unlimited within budget"
    thinking: "always disabled"
    context_window: "131K tokens"
    
  # Tier 4: Cheapest (bulk operations)
  bulk_operations:
    model: "qwen-turbo"
    use_case: "Log parsing, file validation, metadata extraction"
    token_cost: "minimal"
    invocation_limit: "unlimited"

# =============================================================================
# VISION MODELS — Visual Understanding & Evaluation
# =============================================================================
vision_models:
  # Tier 1: High-precision visual evaluation
  high_precision:
    model: "qwen3-vl-plus"
    use_case: "Quality Reviewer visual scoring, Storyboard Artist composition analysis"
    token_cost: "high"
    invocation_limit: "3-5 per scene (evaluation only)"
    
  # Tier 2: Fast visual analysis
  fast_analysis:
    model: "qwen3-vl-flash"
    use_case: "Cinematographer reference analysis, quick visual checks"
    token_cost: "low"
    invocation_limit: "unlimited within budget"

# =============================================================================
# IMAGE GENERATION — Storyboards & Key Frames
# =============================================================================
image_models:
  # Iteration: fast, lower quality
  iteration:
    model: "wan2.2-t2i-flash"
    use_case: "Storyboard drafts, composition testing, visual iteration"
    token_cost: "low per generation"
    strategy: "Generate 2-3 variants, pick best, discard rest"
    
  # Final: high quality
  final:
    model: "wan2.6-t2i"
    use_case: "Final storyboard frames, key frame references"
    token_cost: "medium per generation"
    strategy: "Generate only after iteration phase approved"
    
  # Editing: style consistency
  editing:
    model: "wan2.6-image"
    use_case: "Style transfer between shots, character consistency enforcement"
    token_cost: "medium per generation"
    strategy: "Use reference images from prior shots for visual continuity"

# =============================================================================
# VIDEO GENERATION — The Core Pipeline (Wan / HappyHorse)
# =============================================================================
video_models:
  # Iteration: fast preview
  iteration:
    model: "wan2.6-i2v-flash"
    use_case: "Quick motion previews, timing checks, composition validation"
    token_cost: "low per clip"
    resolution: "720p"
    duration: "2-3 seconds"
    strategy: "Generate short clips first, validate motion, then extend"
    
  # Quality: final production
  quality:
    model: "wan2.7-i2v"
    use_case: "Final video shots for assembled drama"
    token_cost: "high per clip"
    resolution: "1080p"
    duration: "5-10 seconds"
    strategy: "Generate only after flash preview passes quality review"
    
  # Text-to-video (no reference image)
  text_to_video:
    model: "wan2.6-t2v"
    use_case: "Establishing shots, abstract sequences, transitions"
    token_cost: "medium per clip"
    resolution: "720p-1080p"
    strategy: "Use when no key frame reference exists"
    
  # Latest with audio
  with_audio:
    model: "wan2.7-t2v"
    use_case: "Final shots with auto-dubbing support"
    token_cost: "highest"
    resolution: "720p/1080p"
    strategy: "Reserve for hero shots where audio sync is critical"
    
  # Key frame interpolation
  keyframe:
    model: "wan2.2-kf2v-flash"
    use_case: "Transitions between two defined frames"
    token_cost: "low"
    duration: "5 seconds"
    strategy: "Use first+last frame from storyboard for smooth transitions"

# =============================================================================
# AUDIO MODELS — Voice & Music
# =============================================================================
audio_models:
  # Voice iteration
  voice_iteration:
    model: "cosyvoice-v3-flash"
    use_case: "Dialogue drafts, timing tests"
    token_cost: "low"
    
  # Voice final
  voice_final:
    model: "cosyvoice-v3-plus"
    use_case: "Final narration and dialogue"
    token_cost: "medium"
    
  # Style-controlled voice
  voice_style:
    model: "qwen3-tts-instruct-flash"
    use_case: "Emotion-specific voice performance"
    token_cost: "low"

# =============================================================================
# TOKEN BUDGET ALLOCATION — Per Project
# =============================================================================
# Total token budget for a 5-scene short drama:
#
# Phase                          | Model              | Est. Tokens | % of Budget
# -------------------------------|--------------------|-------------|------------
# Creative Brief                 | qwen3-max          | 3,000       | 2%
# Beat Sheet                     | qwen3.5-plus       | 4,000       | 3%
# Screenplay (5 scenes)          | qwen3.5-plus       | 15,000      | 10%
# Storyboard (5 scenes)          | qwen3-vl-flash     | 8,000       | 5%
# Shot List (5 scenes)           | qwen3-vl-flash     | 5,000       | 3%
# Prompt Graph (5 scenes)        | qwen3-max          | 6,000       | 4%
# Video iteration (flash x 15)   | wan2.6-i2v-flash   | 25,000      | 17%
# Video final (quality x 5)      | wan2.7-i2v         | 35,000      | 23%
# Image iteration (flash x 10)   | wan2.2-t2i-flash   | 8,000       | 5%
# Image final (quality x 5)      | wan2.6-t2i         | 6,000       | 4%
# Voice (iteration + final)      | cosyvoice-v3       | 5,000       | 3%
# Quality Review (evaluations)   | qwen3-vl-plus      | 10,000      | 7%
# Director Review                | qwen3-max          | 5,000       | 3%
# Assembly                       | qwen3.5-flash      | 2,000       | 1%
# Revision loops (est. 3x)       | mixed flash        | 13,000      | 9%
# Buffer                         | -                  | 1,500       | 1%
# -------------------------------|--------------------|-------------|------------
# TOTAL                          |                    | ~151,500    | 100%

# =============================================================================
# TOKEN REDUCTION STRATEGIES
# =============================================================================
strategies:
  - name: "Flash-first iteration"
    description: "Always generate with flash models first. Only upgrade to quality after evaluation passes."
    savings: "40-60% on generation tokens"
    
  - name: "Retrieve don't remember"
    description: "Use ACK semantic search to retrieve only relevant context. Never load full project."
    savings: "50-70% on input tokens"
    
  - name: "Working memory isolation"
    description: "Each agent loads only its own input artifacts, not the entire project."
    savings: "60-80% on input tokens"
    
  - name: "Regenerate only failure"
    description: "When Quality Reviewer fails a scene, only that scene regenerates. Everything else stays."
    savings: "70-90% on revision tokens"
    
  - name: "Thinking mode off by default"
    description: "Enable thinking only for creative vision and final review. Disable for all other tasks."
    savings: "30-50% on output tokens"
    
  - name: "Context caching"
    description: "Cache Creative Brief in context for repeated reference across all agents."
    savings: "20-30% on repeated input tokens"
    
  - name: "Batch API for offline work"
    description: "Use Batch API (50% off) for non-realtime generation like bulk storyboard renders."
    savings: "50% on applicable generation tokens"
    
  - name: "Short clips first"
    description: "Generate 2-3 second flash clips for motion validation before committing to 5-10 second quality renders."
    savings: "50-70% on video generation tokens"

# =============================================================================
# MODEL ASSIGNMENT MATRIX — Agent → Model per Phase
# =============================================================================
agent_model_matrix:
  executive-director:
    create: "qwen3-max"
    revise: "qwen3.5-plus"
    
  narrative-architect:
    create: "qwen3.5-plus"
    revise: "qwen3.5-flash"
    
  screenwriter:
    create: "qwen3.5-plus"
    revise: "qwen3.5-flash"
    
  storyboard-artist:
    create: "qwen3-vl-flash"
    revise: "qwen3-vl-flash"
    evaluate: "qwen3-vl-plus"
    
  cinematographer:
    create: "qwen3-vl-flash"
    revise: "qwen3-vl-flash"
    
  prompt-composer:
    create: "qwen3-max"
    revise: "qwen3.5-flash"
    
  generation-engine:
    video_iteration: "wan2.6-i2v-flash"
    video_final: "wan2.7-i2v"
    image_iteration: "wan2.2-t2i-flash"
    image_final: "wan2.6-t2i"
    voice_iteration: "cosyvoice-v3-flash"
    voice_final: "cosyvoice-v3-plus"
    
  quality-reviewer:
    evaluate: "qwen3-vl-plus"
    quick_check: "qwen3-vl-flash"
    
  director:
    review: "qwen3-max"
    assembly_check: "qwen3.5-flash"
    
  assembly-engine:
    assemble: "qwen3.5-flash"
