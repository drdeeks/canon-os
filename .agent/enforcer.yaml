# Audit configuration
audit:
  enabled: true
  path: ".agent/logs/enforcer-audit.jsonl"
  log_every_call: true
  include_identity_hash: true

# Fail-closed default
default_policy: "deny"
fail_open_env: "ACK_FAIL_OPEN"
