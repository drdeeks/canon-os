# Enforcer Policy: Creative Studio
# Fail-closed: unlisted tools are denied by default

# Global deny — these are never allowed regardless of agent
global_deny:
  - "rm -rf /"
  - "rm -rf ~"
  - "dd if=/dev/zero"
  - "mkfs"
  - ":(){:|:&};:"
  - "chmod 777 /*"
  - "curl.*|.*sh"
  - "wget.*|.*sh"

# Agent-specific tool policies
agents:
  executive-director:
    allow:
      - "read_file"
      - "write_file"
      - "terminal:cat"
      - "terminal:ls"
      - "terminal:head"
      - "aik memory"
      - "aik knowledge"
    deny:
      - "terminal:rm"
      - "terminal:curl"
      - "terminal:wget"
      - "image_generate"

  narrative-architect:
    allow:
      - "read_file"
      - "write_file"
      - "terminal:cat"
      - "terminal:ls"
      - "aik memory"
