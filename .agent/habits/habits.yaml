# Habits: Identity Enforcement Patterns
# Loaded by ACK enforcer before every tool call

habits:
  # Pre-action habit: verify artifact chain state before writing
  - name: "chain-gate"
    trigger: "before_write"
    action: "Check chain.py state — only write files in 'active' state"
    enforcement: "chain.py check <project> creative-pipeline <target_file>"
    on_fail: "DENY — file is locked, complete prior step first"

  # Pre-action habit: retrieve context, don't load full project
  - name: "context-retrieval"
    trigger: "before_inference"
    action: "Use ACK semantic search to retrieve only relevant context"
    enforcement: "aik semantic search '<current task topic>'"
    on_fail: "WARN — proceeding without context retrieval may cause drift"

  # Post-action habit: validate artifact after creation
  - name: "artifact-validation"
    trigger: "after_write"
    action: "Validate created artifact meets minimum requirements"
    enforcement: "validate.py --file <created_file> --min-lines 5 --non-empty"
    on_fail: "RETRY — artifact is invalid, fix and re-verify"

  # Post-action habit: log to memory
  - name: "memory-logging"
    trigger: "after_completion"
    action: "Log completed artifact to ACK memory system"
    enforcement: "aik memory log '<artifact name> completed' --tags 'pipeline,<phase>'"
    on_fail: "WARN — memory not logged, continuity at risk"

  # Identity reassertion: check constitution on every 10th call
  - name: "identity-reassertion"
    trigger: "periodic"
    interval: 10
    action: "Re-read constitution.yaml and verify current work aligns"
    enforcement: "read_file .agent/constitution.yaml + cross-reference current task"
    on_fail: "DENY — work has drifted from identity, realign before continuing"
